server:
  port: 8080
spring:
  application:
    name: ac-agent-client
  ai:
    model:
      chat: openai
      embedding: none
      image: none
      audio:
        transcription: none
        speech: none
      moderation: none
    openai:
      base-url: "${AI_OPENAI_BASE_URL:http://192.168.5.68:6116/v1}"
      api-key: ""
      chat:
        completions-path: /chat/completions
        options:
          model: "${AI_OPENAI_MODEL:trs-m6}"
          extra-body:
            chat_template_kwargs:
              enable_thinking: false
ac:
  deployment:
    # Set true only when shared result, AG-UI replay, and SAA checkpoint stores are installed.
    distributed: "${AC_DISTRIBUTED:false}"
  ag-ui:
    retention: 30m
    replay-limit: 512
    maximum-runs: 10000
  result-store:
    ttl: 45m
    maximum-entries: 10000
    maximum-entries-per-tenant: 1000
    maximum-bytes-per-result: 2097152
    maximum-bytes-per-tenant: 268435456
  result-api:
    rate-limit:
      requests: 120
      window: 1m
      maximum-subjects: 100000
  agent:
    hitl:
      # Comma-separated exposed tool names that require HumanInTheLoop approval.
      approval-tools: "${AI_HITL_APPROVAL_TOOLS:}"
  mcp:
    servers:
      - code: knowledge
        name: AC Knowledge MCP
        base-url: http://localhost:8081
        endpoint: /mcp
        timeout: 30s
        enabled: true
        tool-prefix: ""
        auth:
          type: NONE

server:
  port: 8080
spring:
  application:
    name: ac-agent-client
  ai:
    model:
      chat: openai
      embedding: none
      image: none
      audio:
        transcription: none
        speech: none
      moderation: none
    openai:
      base-url: "${AI_OPENAI_BASE_URL:http://192.168.5.68:6116/v1}"
      api-key: ""
      chat:
        completions-path: /chat/completions
        options:
          model: "${AI_OPENAI_MODEL:trs-m6}"
ac:
  result-store:
    ttl: 45m
  mcp:
    servers:
      - code: knowledge
        name: AC Knowledge MCP
        base-url: http://localhost:8081
        endpoint: /mcp
        timeout: 30s
        enabled: true
        tool-prefix: ""
        auth:
          type: NONE

server:
  port: 8081
spring:
  application:
    name: ac-knowledge-mcp
  ai:
    mcp:
      server:
        name: ac-knowledge-mcp
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
        annotation-scanner:
          enabled: true
        streamable-http:
          mcp-endpoint: /mcp
management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: "${AGENTSCOPE_SERVER_PORT:8082}"

spring:
  application:
    name: ac-agentscope-client

ac:
  mcp-apps:
    allowed-tools: "${AC_MCP_APP_ALLOWED_TOOLS:knowledge:kg_fund_flow_graph,knowledge:kg_fund_flow_expand,knowledge:kg_fund_flow_filter,knowledge:kg_fund_flow_transactions}"
  deployment:
    # Set true only when shared result, AG-UI replay, and AgentScope state stores are installed.
    distributed: "${AC_DISTRIBUTED:false}"
  ag-ui:
    retention: 30m
    replay-limit: 512
    maximum-runs: 10000
  agentscope:
    agent:
      name: ac-rich-agent
      system-prompt: >-
        You are a careful assistant. Use MCP tools for factual work. When an MCP observation
        contains resultRef and recommended views, call ui_render with that resultRef and one viewId.
        When the user asks to extend a surface in the same run, use the surfaceId returned by
        ui_render and call ui_update with a new resultRef and viewId from a new MCP result.
        Never invent resultRef, viewId, tenant, user, thread, run, or tool-call identifiers.
        MCP App tools such as kg_fund_flow_graph automatically display their interactive App through
        the Host after a successful call. They do not require ui_render or a recommended viewId.
        Do not claim that an App is unavailable merely because recommended views are empty.
        For App followups, use the authorized selected nodes, filters and transaction data provided
        in the additional context. Distinguish the selected account from the root entity, keep
        currencies separate, explain bounded data limits and do not invent missing amounts or totals.
        Describe observed directions and timestamps only. Graph topology alone does not establish
        pass-through funds, agency payments, causation or the business purpose of a transaction.
        Label any calculations over the supplied transactions as sample calculations, never as
        authoritative totals for the account or the complete period.
        When asked for funds-flow characteristics, limit the answer to the observed transaction
        rows, exact dates, directions, counterpart account IDs, per-currency sample amounts and
        data limits. Do not speculate about payment purpose, settlement, agency payments or
        business modes, even with words such as "possibly". Do not generalize a few dates into
        monthly frequency patterns. Never compare CNY and USD amounts without an exchange rate.
    model:
      base-url: "${AGENTSCOPE_OPENAI_BASE_URL:http://192.168.5.68:6116/v1}"
      endpoint-path: "${AGENTSCOPE_OPENAI_ENDPOINT:/chat/completions}"
      api-key: "${AGENTSCOPE_OPENAI_API_KEY:}"
      name: "${AGENTSCOPE_OPENAI_MODEL:trs-m6}"
      # Some OpenAI-compatible gateways drop streaming POST bodies over JDK HTTP/2.
      http-version: "${AGENTSCOPE_OPENAI_HTTP_VERSION:HTTP_1_1}"
    result-store:
      ttl: 45m
      maximum-entries: 10000
      maximum-entries-per-tenant: 1000
      maximum-bytes-per-result: 2097152
      maximum-bytes-per-tenant: 268435456
    # Replace the default InMemoryAgentStateStore bean with Redis/MySQL in multi-replica deployments.
    security:
      tenant-header: "${AGENTSCOPE_TENANT_HEADER:X-Tenant-Id}"
      user-header: "${AGENTSCOPE_USER_HEADER:X-User-Id}"
    mcp:
      servers:
        - code: knowledge
          name: AC Knowledge MCP
          base-url: "${AGENTSCOPE_MCP_BASE_URL:http://localhost:8081}"
          endpoint: "${AGENTSCOPE_MCP_ENDPOINT:/mcp}"
          timeout: 30s
          enabled: true
          tool-prefix: ""
          auth:
            type: NONE
  result-api:
    rate-limit:
      requests: 120
      window: 1m
      maximum-subjects: 100000
